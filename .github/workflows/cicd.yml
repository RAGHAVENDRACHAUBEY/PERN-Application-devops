name: Deploy Todo DnD

on:
  push:
    branches:
      - PERN-Application-devops
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. TEST SERVER AND CLIENT ----------
  test:
    name: Typecheck & build (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [server, client]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.app == 'server'
        run: npx prisma generate

      - name: Build Application
        run: npm run build

  # ---------- 2. BUILD BACKEND AND MIGRATION IMAGES ----------
  build:
    name: Push image (${{ matrix.name }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            target: runtime

          - name: migrate
            context: ./server
            target: migrate

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-${{ matrix.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ---------- 3. BUILD FRONTEND DOCKER IMAGE FOR EC2 ----------
  build-client:
    name: Push image (client)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-client:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
          build-args: |
            VITE_API_URL=/api

  # ---------- 4. DEPLOY ALL CONTAINERS ON EC2 ----------
  deploy:
    name: Deploy Application on EC2
    needs: [build, build-client]
    if: github.event_name != 'pull_request'
    runs-on: self-hosted

    env:
      COMPOSE_PROJECT_NAME: todo-dnd

      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

      API_PORT: 4000
      WEB_PORT: 3000

      # S3 website origin is used for cross-origin API requests.
      CLIENT_ORIGIN: http://mern-s3-devops.s3-website-ap-southeast-2.amazonaws.com

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Images
        run: docker compose pull migrate server client

      - name: Start Database, Migration, Backend and Frontend
        run: docker compose up -d --no-build db migrate server client

      - name: Check Running Containers
        run: docker compose ps

      - name: Verify EC2 Frontend and Backend
        run: |
          for i in {1..12}; do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              break
            fi
            sleep 5
          done

          curl -fsS http://127.0.0.1:3000/healthz
          curl -fsS http://127.0.0.1:4000/health

      - name: Remove Dangling Images
        run: docker image prune -f

  # ---------- 5. BUILD AND DEPLOY FRONTEND TO S3 ----------
  deploy-client:
    name: Deploy Frontend to S3
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build Client for S3
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL" || (echo "VITE_API_URL repository variable is missing" && exit 1)
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload Static Assets
        run: |
          aws s3 sync client/dist s3://mern-s3-devops \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        run: |
          aws s3 cp client/dist/index.html s3://mern-s3-devops/index.html \
            --cache-control "no-cache"
