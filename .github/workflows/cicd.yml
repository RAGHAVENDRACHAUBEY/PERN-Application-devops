name: Deploy Todo DnD

on:
  push:
    branches:
      - PERN-Application-devops
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. TEST SERVER AND CLIENT ----------
  test:
    name: Typecheck & build (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [server, client]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        if: matrix.app == 'server'
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ---------- 2. BUILD SERVER AND MIGRATE IMAGES ----------
  build:
    name: Push image (${{ matrix.name }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            target: runtime

          - name: migrate
            context: ./server
            target: migrate

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-${{ matrix.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ---------- 3. BUILD FRONTEND DOCKER IMAGE ----------
  build-client:
    name: Push image (client)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-client:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-dnd-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
          build-args: |
            VITE_API_URL=/api

  # ---------- 4. DEPLOY ALL CONTAINERS ON EC2 ----------
  deploy:
    name: Deploy Backend and Frontend on EC2
    needs: [build, build-client]
    if: github.event_name != 'pull_request'
    runs-on: self-hosted

    env:
      COMPOSE_PROJECT_NAME: todo-dnd
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

      API_PORT: 4000
      WEB_PORT: 3000

      CLIENT_ORIGIN: http://54.206.113.134:3000

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Images
        run: docker compose pull migrate server client

      - name: Start Database, Migration, Backend and Frontend
        run: docker compose up -d --no-build db migrate server client

      - name: Check Running Containers
        run: docker compose ps

      - name: Remove dangling images
        run: docker image prune -f

  # ---------- 5. DEPLOY FRONTEND TO S3 ----------
  deploy-client:
    name: Deploy client to S3
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client for S3
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload assets
        run: |
          aws s3 sync client/dist s3://mern-s3-devops \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        run: |
          aws s3 cp client/dist/index.html s3://mern-s3-devops/index.html \
            --cache-control "no-cache"
